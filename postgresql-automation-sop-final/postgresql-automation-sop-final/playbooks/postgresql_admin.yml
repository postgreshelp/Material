---
- name: PostgreSQL administration
  hosts: postgresql
  gather_facts: false

  tasks:
    - name: Get PostgreSQL version
      community.postgresql.postgresql_query:
        query: "SELECT version();"
        login_host: "{{ postgresql_host }}"
        login_port: "{{ postgresql_port }}"
        login_user: "{{ postgresql_admin_user }}"
        login_password: "{{ postgresql_admin_password }}"
        login_db: "{{ postgresql_database }}"
      register: postgres_version

    - name: Display PostgreSQL version
      ansible.builtin.debug:
        var: postgres_version.query_result

    - name: Get database size
      community.postgresql.postgresql_query:
        query: "SELECT pg_size_pretty(pg_database_size(current_database())) AS database_size;"
        login_host: "{{ postgresql_host }}"
        login_port: "{{ postgresql_port }}"
        login_user: "{{ postgresql_admin_user }}"
        login_password: "{{ postgresql_admin_password }}"
        login_db: "{{ postgresql_database }}"
      register: database_size

    - name: Display database size
      ansible.builtin.debug:
        var: database_size.query_result

    - name: Get connection count
      community.postgresql.postgresql_query:
        query: "SELECT count(*) AS connection_count FROM pg_stat_activity;"
        login_host: "{{ postgresql_host }}"
        login_port: "{{ postgresql_port }}"
        login_user: "{{ postgresql_admin_user }}"
        login_password: "{{ postgresql_admin_password }}"
        login_db: "{{ postgresql_database }}"
      register: connection_count

    - name: Display connection count
      ansible.builtin.debug:
        var: connection_count.query_result

    - name: Get active sessions
      community.postgresql.postgresql_query:
        query: |
          SELECT pid, usename, datname, state, query
          FROM pg_stat_activity
          WHERE state = 'active'
          ORDER BY pid;
        login_host: "{{ postgresql_host }}"
        login_port: "{{ postgresql_port }}"
        login_user: "{{ postgresql_admin_user }}"
        login_password: "{{ postgresql_admin_password }}"
        login_db: "{{ postgresql_database }}"
      register: active_sessions

    - name: Display active sessions
      ansible.builtin.debug:
        var: active_sessions.query_result
